    <script>

        const originalFetch = window.fetch;

        window.fetch = async function (...args) {

            const url = args[0];

            const response =
                await originalFetch.apply(this, args);

            if (
                typeof url === "string" &&
                (
                    url.includes("/aadhaar/verify") ||
                    url.includes("/aadhaar/auto-login")
                )
            ) {

                console.log(
                    "===================================="
                );

                console.log(
                    "EKA API:",
                    url
                );

                console.log(
                    "REQUEST:",
                    args[1]
                );

                const clone = response.clone();

                try {

                    const data =
                        await clone.json();

                    console.log(
                        "RESPONSE:",
                        data
                    );


console.log(
                        "RESPONSE Test **************************:",
                        data.eka.oid
                    );

                    console.log(
                        "RESPONSE JSON:",
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    );

                }
                catch (error) {

                    console.error(
                        "Response parse error:",
                        error
                    );
                }

                console.log(
                    "===================================="
                );
            }

            return response;
        };
